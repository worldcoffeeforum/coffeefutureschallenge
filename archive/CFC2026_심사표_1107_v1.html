<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CFC 2026 본선 심사표</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
</head>
<body>
<style>
/* Layout: 상단 심사위원 선택 → (노트북) 왼쪽 팀 목록 | 오른쪽 채점 폼, (모바일) 위아래. 집계 탭은 표 하나. 매뉴얼과 같은 토큰 */
:root{
  --bg:#efefef; --surface:#ffffff; --ink:#151816; --muted:#68706b; --line:#dadddb;
  --accent:#234c38; --accent-ink:#ffffff; --accent-soft:#e3ece6;
  --odd:#e3eef9; --even:#fbe7dc; --ok:#2e7d4f; --ok-soft:#dcefe3; --wait:#a15c00; --wait-soft:#fdf1df; --bad:#b3261e;
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121413; --surface:#1b1e1c; --ink:#eceeed; --muted:#9ba39e; --line:#2f3431;
  --accent:#8cc8a6; --accent-ink:#0f1a14; --accent-soft:#1f2d26;
  --odd:#1a2733; --even:#33241d; --ok:#7fcf9c; --ok-soft:#1d3326; --wait:#f0b35a; --wait-soft:#3a2a14; --bad:#f28b82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121413; --surface:#1b1e1c; --ink:#eceeed; --muted:#9ba39e; --line:#2f3431;
  --accent:#8cc8a6; --accent-ink:#0f1a14; --accent-soft:#1f2d26;
  --odd:#1a2733; --even:#33241d; --ok:#7fcf9c; --ok-soft:#1d3326; --wait:#f0b35a; --wait-soft:#3a2a14; --bad:#f28b82; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
p{margin:0} h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink);padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.bar h1{font-size:1.05rem;font-weight:900;margin-right:auto}
.seg{display:flex;background:color-mix(in srgb,var(--accent-ink) 18%,transparent);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--accent-ink);font-weight:700;font-size:.88rem;padding:6px 12px;border-radius:8px}
.seg button[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent)}
.conn{font-size:.78rem;opacity:.9;width:100%}
main{max-width:1180px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.notice{background:var(--wait-soft);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:12px}
.notice b{color:var(--wait)}
/* judge layout */
.judge{display:grid;gap:14px;grid-template-columns:1fr}
@media (min-width:860px){.judge{grid-template-columns:280px minmax(0,1fr);align-items:start}}
.tlist{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
@media (min-width:860px){.tlist{grid-template-columns:1fr;position:sticky;top:76px}}
.tbtn{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;text-align:left;border:2px solid transparent;border-radius:10px;padding:9px 10px;color:var(--ink)}
.tbtn.odd{background:var(--odd)} .tbtn.even{background:var(--even)}
.tbtn[aria-current="true"]{border-color:var(--ink)}
.tbtn .n{font-family:var(--mono);font-weight:600;color:var(--accent);font-size:1.05rem}
.tbtn .nm{font-weight:700;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tbtn .sc{font-family:var(--mono);font-size:.85rem}
.st{display:inline-block;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
.st.none{color:var(--muted);border:1px solid var(--line);background:var(--surface)}
.st.draft{color:var(--wait);background:var(--wait-soft)}
.st.done{color:var(--ok);background:var(--ok-soft)}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px;min-width:0}
.sh-top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}
.sh-top h2{font-size:1.35rem;font-weight:900}
.sh-top .meta{color:var(--muted);font-size:.85rem}
.crit{display:grid;gap:8px}
.cr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cr:last-child{border-bottom:0}
.cr label{font-weight:700;font-size:.95rem}
.cr label small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.num{display:flex;align-items:center;gap:6px}
.num button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1.2rem;font-weight:700}
.num input{width:64px;height:38px;text-align:center;font-family:var(--mono);font-size:1.15rem;font-weight:600;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.num input.err{border-color:var(--bad);color:var(--bad)}
.num .max{font-size:.8rem;color:var(--muted);font-family:var(--mono);width:30px}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--accent-soft);border-radius:10px;padding:12px 14px}
.total b{font-family:var(--mono);font-size:1.8rem;font-weight:600;color:var(--accent)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--ink);resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.saved{font-size:.82rem;color:var(--muted);margin-left:auto}
.locked .num button,.locked .num input,.locked textarea{pointer-events:none;opacity:.7}
/* summary */
.sum-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:10px}
.sum-head h2{font-size:1.15rem;font-weight:900}
.sum-head span{color:var(--muted);font-size:.85rem}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap}
th{font-size:.75rem;color:var(--muted);font-weight:500;background:var(--bg)}
tr:last-child td{border-bottom:0}
td.r{text-align:right;font-family:var(--mono)}
td.rank{font-family:var(--mono);font-weight:600;font-size:1.05rem;color:var(--accent)}
tr.odd td:first-child{box-shadow:inset 4px 0 0 #8db6dd} tr.even td:first-child{box-shadow:inset 4px 0 0 #e7a98a}
.memos{display:grid;gap:10px;margin-top:16px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.memo{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:6px;font-size:.88rem}
.memo h3{font-size:.95rem}
.memo p{white-space:pre-wrap;color:var(--ink)}
.memo small{color:var(--muted)}
.foot{color:var(--muted);font-size:.8rem;margin-top:18px}
</style>

<header class="bar"><div class="bar-in">
  <h1>CFC 2026 본선 심사표</h1>
  <div class="seg" role="group" aria-label="보기 선택">
    <button type="button" data-v="jo" aria-pressed="false">조원진</button>
    <button type="button" data-v="park" aria-pressed="false">박재현</button>
    <button type="button" data-v="sum" aria-pressed="false">집계</button>
  </div>
  <span class="conn" id="conn">저장소 연결 중…</span>
</div></header>

<main>
  <div class="notice" id="notice" hidden></div>
  <div id="judgeView" class="judge" hidden>
    <nav class="tlist" id="tlist" aria-label="발표 팀"></nav>
    <form class="sheet" id="sheet" autocomplete="off">
      <div class="sh-top"><h2 id="tName"></h2><span class="meta" id="tMeta"></span><span id="tStatus"></span></div>
      <div class="crit" id="crit"></div>
      <div class="total"><span>합계 <small class="mono">/ 100</small></span><b id="tot">0</b></div>
      <div><label for="memo" style="font-weight:700;font-size:.95rem">메모</label>
        <textarea id="memo" placeholder="질문할 내용, 인상적인 점, 보완점을 자유롭게 적어 주세요"></textarea></div>
      <div class="actions">
        <button type="button" class="btn" id="submitBtn">이 팀 점수 확정</button>
        <button type="button" class="btn ghost" id="editBtn" hidden>확정 취소하고 수정</button>
        <button type="button" class="btn ghost" id="nextBtn">다음 팀 →</button>
        <span class="saved" id="saved"></span>
      </div>
    </form>
  </div>
  <div id="sumView" hidden>
    <div class="sum-head"><h2>실시간 집계</h2><span id="sumInfo"></span></div>
    <div class="tbl"><table><thead><tr><th>순위</th><th>순서 · 팀</th><th>조원진</th><th>박재현</th><th>합계</th><th>평균</th><th>20점 항목 합</th><th>상태</th></tr></thead><tbody id="sumBody"></tbody></table></div>
    <p class="foot">동점이면 20점 항목 2개(5·6번) 합이 높은 팀이 앞섭니다. 그래도 같으면 심사위원 협의로 정합니다. 확정되지 않은 점수도 표에 보이지만 순위는 참고용입니다.</p>
    <div class="memos" id="memos"></div>
  </div>
  <p class="foot">점수와 메모는 입력하는 즉시 저장되어 집계 화면에 실시간으로 반영됩니다. 이 페이지는 운영 계정과 편집 권한을 받은 사람만 점수를 읽고 쓸 수 있습니다. 문제가 생기면 심사석의 종이 심사표를 사용해 주세요.</p>
</main>

<script>
// ===== 심사 기준: 공고 확정 문구로 이름만 바꾸면 됩니다 =====
var CRITERIA = [
  {k:"s1", name:"심사 항목 1", desc:"공고 기준 문구 입력 예정", max:15},
  {k:"s2", name:"심사 항목 2", desc:"공고 기준 문구 입력 예정", max:15},
  {k:"s3", name:"심사 항목 3", desc:"공고 기준 문구 입력 예정", max:15},
  {k:"s4", name:"심사 항목 4", desc:"공고 기준 문구 입력 예정", max:15},
  {k:"s5", name:"심사 항목 5", desc:"공고 기준 문구 입력 예정", max:20},
  {k:"s6", name:"심사 항목 6", desc:"공고 기준 문구 입력 예정", max:20}
];
var TEAMS = [
  {n:1, name:"고으니", mem:"고은희", t:"13:10"},
  {n:2, name:"커알못", mem:"오현주·전영채·최예윤·한종아", t:"13:30"},
  {n:3, name:"마홍주", mem:"개인 참가", t:"13:50"},
  {n:4, name:"unch", mem:"황채원·홍은채", t:"14:10"},
  {n:5, name:"원두잇", mem:"전해원", t:"15:00"},
  {n:6, name:"원두ONE", mem:"함유선·성유정·백종헌·방주혁", t:"15:20"},
  {n:7, name:"이다(ieda)", mem:"박경민·김태희·이영진", t:"15:40"},
  {n:8, name:"온에어(OnAir)", mem:"윤지선·정민서·이재윤·이수민", t:"16:00"}
];
var JUDGES = {jo:"조원진", park:"박재현"};

(function(){
  var $ = function(id){return document.getElementById(id)};
  var state = {};          // docId -> data (from store)
  var drafts = {};         // docId -> local edits not yet confirmed
  var db = null, view = null, team = 1, canWrite = true;
  var writeChain = {}, timers = {};

  function docId(j, n){ return j + "_t" + n; }
  function cur(j, n){ var id = docId(j, n); return drafts[id] || state[id] || null; }
  function total(d){ if(!d) return 0; return CRITERIA.reduce(function(a,c){ var v = +d[c.k]; return a + (isFinite(v) ? v : 0); }, 0); }
  function filled(d){ return d ? CRITERIA.filter(function(c){ return d[c.k] !== "" && d[c.k] != null; }).length : 0; }
  function status(d){ if(!d || (!filled(d) && !d.memo)) return "none"; return d.submitted ? "done" : "draft"; }
  var ST = {none:"미입력", draft:"작성 중", done:"확정"};
  function chip(s){ var e = document.createElement("span"); e.className = "st " + s; e.textContent = ST[s]; return e; }
  function hhmm(ts){ if(!ts) return ""; var d = new Date(ts); return d.toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit",hour12:false,timeZone:"Asia/Seoul"}); }

  // ---- view switching
  var segBtns = [].slice.call(document.querySelectorAll(".seg button"));
  function setView(v){
    view = v;
    segBtns.forEach(function(b){ b.setAttribute("aria-pressed", String(b.dataset.v === v)); });
    try{ localStorage.setItem("cfc-judge-view", v); }catch(e){}
    $("judgeView").hidden = (v === "sum"); $("sumView").hidden = (v !== "sum");
    render();
  }
  segBtns.forEach(function(b){ b.addEventListener("click", function(){ setView(b.dataset.v); }); });

  // ---- judge form
  function buildCrit(){
    var box = $("crit"); box.textContent = "";
    CRITERIA.forEach(function(c){
      var row = document.createElement("div"); row.className = "cr";
      var lab = document.createElement("label"); lab.htmlFor = "in_" + c.k; lab.textContent = c.name + " ";
      var sm = document.createElement("small"); sm.textContent = c.desc; lab.appendChild(sm);
      var num = document.createElement("div"); num.className = "num";
      var minus = document.createElement("button"); minus.type = "button"; minus.textContent = "−"; minus.setAttribute("aria-label", c.name + " 1점 빼기");
      var inp = document.createElement("input"); inp.id = "in_" + c.k; inp.type = "number"; inp.inputMode = "numeric"; inp.min = 0; inp.max = c.max; inp.step = 1;
      var plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+"; plus.setAttribute("aria-label", c.name + " 1점 더하기");
      var mx = document.createElement("span"); mx.className = "max"; mx.textContent = "/" + c.max;
      minus.onclick = function(){ step(c, -1); }; plus.onclick = function(){ step(c, 1); };
      inp.addEventListener("input", function(){ edit(c.k, inp.value === "" ? "" : Math.round(+inp.value)); });
      num.append(minus, inp, plus, mx); row.append(lab, num); box.appendChild(row);
    });
  }
  function step(c, d){
    var x = cur(view, team) || {}; var v = x[c.k] === "" || x[c.k] == null ? 0 : +x[c.k];
    v = Math.max(0, Math.min(c.max, v + d)); edit(c.k, v); $("in_" + c.k).value = v;
  }
  function base(){ return {judge: view, team: team, s1:"", s2:"", s3:"", s4:"", s5:"", s6:"", memo:"", submitted:false}; }
  function edit(k, v){
    if(view === "sum") return;
    var id = docId(view, team);
    var d = Object.assign(base(), state[id] || {}, drafts[id] || {});
    if(d.submitted && k !== "submitted") return;
    d[k] = v; d.updatedAt = Date.now(); drafts[id] = d;
    paintForm(true); paintList();
    clearTimeout(timers[id]); timers[id] = setTimeout(function(){ save(id); }, 700);
  }
  $("memo").addEventListener("input", function(){ edit("memo", $("memo").value); });

  function valid(d){ return CRITERIA.every(function(c){ var v = d[c.k]; return v === "" || v == null || (v >= 0 && v <= c.max); }); }
  function save(id){
    var d = drafts[id]; if(!d) return;
    if(!valid(d)){ $("saved").textContent = "배점을 넘는 점수가 있어 저장하지 않았습니다"; return; }
    if(!db){ $("saved").textContent = "저장소에 연결되지 않아 이 화면에만 남아 있습니다"; return; }
    var body = JSON.parse(JSON.stringify(d));
    writeChain[id] = (writeChain[id] || Promise.resolve()).then(function(){
      return db.collection("scores").doc(id).set(body);
    }).then(function(){
      if(drafts[id] && drafts[id].updatedAt === body.updatedAt) delete drafts[id];
      if(id === docId(view, team)) $("saved").textContent = "저장됨 " + hhmm(body.updatedAt);
    }).catch(function(e){
      if(e && e.code === "invalid_argument"){ canWrite = false; $("saved").textContent = "이 계정은 점수를 저장할 권한이 없습니다"; }
      else $("saved").textContent = "저장 실패: 잠시 후 다시 입력해 주세요";
    });
  }
  $("submitBtn").onclick = function(){
    var d = cur(view, team) || base();
    if(filled(d) < CRITERIA.length){ $("saved").textContent = "모든 항목에 점수를 넣어야 확정할 수 있습니다"; return; }
    edit("submitted", true); clearTimeout(timers[docId(view, team)]); save(docId(view, team));
  };
  $("editBtn").onclick = function(){ edit("submitted", false); };
  $("nextBtn").onclick = function(){ team = team % 8 + 1; render(); window.scrollTo({top:0}); };

  function paintForm(keepInputs){
    if(view === "sum") return;
    var t = TEAMS[team - 1], d = cur(view, team) || base(), s = status(d);
    $("tName").textContent = t.n + ". " + t.name;
    $("tMeta").textContent = t.mem + " · " + t.t + " 발표";
    var stc = $("tStatus"); stc.textContent = ""; stc.appendChild(chip(s));
    CRITERIA.forEach(function(c){
      var inp = $("in_" + c.k), v = d[c.k];
      if(!keepInputs || document.activeElement !== inp) inp.value = (v === "" || v == null) ? "" : v;
      inp.classList.toggle("err", v !== "" && v != null && (v < 0 || v > c.max));
    });
    if(!keepInputs || document.activeElement !== $("memo")) $("memo").value = d.memo || "";
    $("tot").textContent = total(d);
    $("sheet").classList.toggle("locked", !!d.submitted);
    $("submitBtn").hidden = !!d.submitted; $("editBtn").hidden = !d.submitted;
    if(!keepInputs){ var st = state[docId(view, team)]; $("saved").textContent = st && st.updatedAt ? "마지막 저장 " + hhmm(st.updatedAt) : ""; }
  }
  function paintList(){
    var box = $("tlist"); box.textContent = "";
    TEAMS.forEach(function(t){
      var d = cur(view, t.n), b = document.createElement("button");
      b.type = "button"; b.className = "tbtn " + (t.n % 2 ? "odd" : "even");
      b.setAttribute("aria-current", String(t.n === team));
      var n = document.createElement("span"); n.className = "n"; n.textContent = t.n;
      var nm = document.createElement("span"); nm.className = "nm"; nm.textContent = t.name;
      var right = document.createElement("span"); right.style.display = "grid"; right.style.justifyItems = "end";
      var sc = document.createElement("span"); sc.className = "sc"; sc.textContent = filled(d) ? total(d) : "–";
      right.append(sc, chip(status(d)));
      b.append(n, nm, right);
      b.onclick = function(){ team = t.n; render(); };
      box.appendChild(b);
    });
  }
  // ---- summary
  function paintSum(){
    var rows = TEAMS.map(function(t){
      var a = cur("jo", t.n), b = cur("park", t.n);
      var ta = total(a), tb = total(b);
      var hi = ["s5","s6"].reduce(function(x,k){ return x + (+((a||{})[k])||0) + (+((b||{})[k])||0); }, 0);
      return {t:t, a:a, b:b, ta:ta, tb:tb, sum:ta + tb, hi:hi, done:(a&&a.submitted?1:0) + (b&&b.submitted?1:0)};
    });
    var ranked = rows.slice().sort(function(x,y){ return y.sum - x.sum || y.hi - x.hi; });
    var rank = {}; ranked.forEach(function(r,i){
      var prev = ranked[i-1];
      rank[r.t.n] = (prev && prev.sum === r.sum && prev.hi === r.hi) ? rank[prev.t.n] + "=" : String(i + 1);
    });
    var body = $("sumBody"); body.textContent = "";
    ranked.forEach(function(r){
      var tr = document.createElement("tr"); tr.className = r.t.n % 2 ? "odd" : "even";
      function td(txt, cls){ var e = document.createElement("td"); if(cls) e.className = cls; e.textContent = txt; tr.appendChild(e); return e; }
      td(rank[r.t.n].replace(/=$/, " (동점)"), "rank");
      td(r.t.n + ". " + r.t.name);
      td(filled(r.a) ? r.ta : "–", "r"); td(filled(r.b) ? r.tb : "–", "r");
      td(r.sum, "r"); td((r.sum / 2).toFixed(1), "r"); td(r.hi, "r");
      var st = td(""); st.appendChild(chip(r.done === 2 ? "done" : (filled(r.a) || filled(r.b) ? "draft" : "none")));
      var sm = document.createElement("small"); sm.textContent = " " + r.done + "/2 확정"; sm.style.color = "var(--muted)"; st.appendChild(sm);
      body.appendChild(tr);
    });
    var doneAll = rows.reduce(function(x,r){ return x + r.done; }, 0);
    $("sumInfo").textContent = "확정 " + doneAll + " / 16";
    var mbox = $("memos"); mbox.textContent = "";
    TEAMS.forEach(function(t){
      var card = document.createElement("div"); card.className = "memo";
      var h = document.createElement("h3"); h.textContent = t.n + ". " + t.name; card.appendChild(h);
      ["jo","park"].forEach(function(j){
        var d = cur(j, t.n), s = document.createElement("small"), p = document.createElement("p");
        s.textContent = JUDGES[j] + (d && filled(d) ? " · " + total(d) + "점" : ""); p.textContent = (d && d.memo) || "메모 없음";
        card.append(s, p);
      });
      mbox.appendChild(card);
    });
  }
  function render(){
    if(!view) return;
    if(view === "sum") paintSum(); else { paintList(); paintForm(false); }
  }

  // ---- boot
  buildCrit();
  var saved = null; try{ saved = localStorage.getItem("cfc-judge-view"); }catch(e){}
  setView(saved && /^(jo|park|sum)$/.test(saved) ? saved : "jo");

  var loadTimer = setTimeout(function(){ $("conn").textContent = "저장소에 아직 연결되지 않았습니다. 인터넷 연결을 확인해 주세요."; }, 10000);
  if(!window.claude || !window.claude.use){ clearTimeout(loadTimer); offline(); return; }
  window.claude.use("db").then(function(x){
    db = x;
    if(!db){ clearTimeout(loadTimer); offline(); return; }
    db.collection("scores").onSnapshot(function(snap){
      var next = {};
      snap.docs.forEach(function(d){ if(d.exists) next[d.id] = d.data(); });
      state = next;
      if(!snap.metadata.fromCache){ clearTimeout(loadTimer); $("conn").textContent = "실시간 연결됨 · 다른 기기 입력이 바로 보입니다"; }
      if(view === "sum") paintSum(); else { paintList(); paintForm(true); }
    }, function(e){
      clearTimeout(loadTimer);
      $("conn").textContent = "실시간 연결이 끊겼습니다. 페이지를 다시 열어 주세요.";
    });
  });
  function offline(){
    $("conn").textContent = "저장소를 쓸 수 없는 화면입니다";
    var n = $("notice"); n.hidden = false;
    n.innerHTML = "<b>점수가 저장되지 않습니다.</b> 운영 계정으로 로그인한 claude.ai에서 이 페이지를 열어 주세요. 그동안은 종이 심사표를 사용해 주세요.";
  }
})();
</script>

</html>
